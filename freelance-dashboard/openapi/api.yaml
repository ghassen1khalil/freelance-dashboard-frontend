openapi: 3.0.0
info:
  title: Positions Api
  description: API to save and retrieve positions
  version: 0.0.1
servers:
  - url: http://localhost:8080/api
    description: Local URL
paths:
  /position:
    post:
      summary: Save a Position
      description: Save a new position
      operationId: save
      tags:
        - positions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Position'
      responses:
        201:
          description: CREATED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Position'
        400:
          description: BAD REQUEST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: INTERNAL SERVER ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: Return all positions
      description: Return all position
      operationId: findAll
      tags:
        - positions
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Position'
  /position/{id}:
    get:
      summary: Return a position by ID
      description: Find a position by ID
      operationId: getById
      tags:
        - positions
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID of searched position
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Position'
    patch:
      summary: Update a position by ID
      description: Update a position by ID
      operationId: update
      tags:
        - positions
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID of position to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Position'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Position'
  /position/filter/{keyword}:
    get:
      summary: Return a position by keyword
      description: Find a position by keyword matching one of its attributes values
      operationId: filterByKeyword
      tags:
        - positions
      parameters:
        - in: path
          name: keyword
          schema:
            type: string
          required: true
          description: Keyword matching one of attributes values
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Position'
  /freelancer:
    post:
      summary: Check freelancer
      description: Check if freelancer exists in database
      operationId: checkFreelancer
      tags:
        - freelancer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Freelancer'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: boolean
  /freelancer/signup:
    post:
      summary: SignUp
      description: Sign up a user to save it in the database
      operationId: signUp
      tags:
        - freelancer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Freelancer'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Freelancer"
  /freelancer/authenticate:
    post:
      summary: Login
      description: Login a user with his email and password
      operationId: login
      tags:
        - freelancer
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
                - email
                - password
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Freelancer"
        401:
          $ref: '#/components/responses/UnauthorizedError'

components:
  responses:
    UnauthorizedError:
      description: Authentication information is missing or invalid
      headers:
        WWW_Authenticate:
          schema:
            type: string
  schemas:
    Position:
      x-java-class-annotations:
        - '@org.springframework.data.mongodb.core.mapping.Document(collection = "positions")'
        - '@lombok.Data'
        - '@lombok.Builder'
        - '@lombok.AllArgsConstructor'
        - '@lombok.NoArgsConstructor'
        - |
          @org.springframework.data.mongodb.core.index.CompoundIndexes({@org.springframework.data.mongodb.core.index.CompoundIndex(name = "text_idx", def = "{'client': 'text', 'address': 'text', 'isFullRemote': 'text', 'remarks': 'text', 'mission.role': 'text', 'mission.project': 'text', 'mission.tribe': 'text', 'mission.manager': 'text', 'intermediary.corporation': 'text', 'intermediary.name': 'text', 'dailyRate.amount': text}")})
      type: object
      properties:
        id:
          type: string
        client:
          type: string
        mission:
          $ref: '#/components/schemas/Mission'
        address:
          type: string
        isFullRemote:
          type: boolean
        remarks:
          type: string
        creationDate:
          type: string
          format: date
        startingDate:
          type: string
          format: date
        intermediary:
          $ref: '#/components/schemas/Intermediary'
        dailyRate:
          $ref: '#/components/schemas/DailyRate'
        statuses:
          type: array
          items:
            $ref: '#/components/schemas/Status'
        state:
          $ref: '#/components/schemas/State'
    Mission:
      type: object
      properties:
        role:
          type: string
        project:
          type: string
        tribe:
          type: string
        manager:
          type: string
    Intermediary:
      type: object
      properties:
        corporation:
          type: string
        name:
          type: string
        phones:
          type: string
    Status:
      type: object
      properties:
        label:
          type: string
        date:
          type: string
          format: date
    DailyRate:
      type: object
      properties:
        amount:
          type: number
        currency:
          $ref: '#/components/schemas/Currency'
    Currency:
      type: string
      enum: [ 'CHF','€', '$', '£' ]
      x-enum-varnames: [ 'SWISS_FRANC','EURO','DOLLAR','POUND' ]
    Freelancer:
      x-java-class-annotations:
        - '@org.springframework.data.mongodb.core.mapping.Document(collection = "freelancers")'
        - '@lombok.Data'
        - '@lombok.Builder'
        - '@lombok.AllArgsConstructor'
        - '@lombok.NoArgsConstructor'
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        firstname:
          type: string
        lastname:
          type: string
        email:
          type: string
        password:
          type: string
        picture:
          type: string
    State:
      type: string
      enum: ['ACTIVE', 'ARCHIVED', 'DELETED']
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
