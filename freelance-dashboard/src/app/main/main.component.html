<div>
  <div *ngFor="let year of positionsYears">
    <g-accordion collapsing="true" style="">
      <accordion-item [title]="year.toString()" class="fd-flex fd-flex-column">
        <ng-template accordionContent>
          <app-position-card *ngFor="let position of getPositionsByYear(year)" [position]="position"></app-position-card>
        </ng-template>
      </accordion-item>
    </g-accordion>
  </div>
</div>
