<div class="sidebar h-screen flex flex-col">
  <div class="flex-1 overflow-y-auto">
    <p-menu [model]="navigationMenuItems" styleClass="w-64 border-none h-full">
      <ng-template #start>
        <div class="p-4">
          <div class="flex items-center gap-2">
            <!--<img
              alt="freelance dashboard logo"
              ngSrc="assets/icons/freelance_dashboard_logo.svg"
              class="w-8 h-8"
              width="32"
              height="32"
              (click)="goToHome()"
            />-->
            <span class="text-xl font-semibold cursor-pointer" (click)="goToRoute(AppRoutes.MAIN)">
              {{'app-title' | translate}}
            </span>
          </div>
        </div>
      </ng-template>

      <ng-template #submenuheader let-item>
        <span class="text-primary font-bold">{{ item.label }}</span>
      </ng-template>

      <ng-template #item let-item>
        <a pRipple class="flex items-center p-menu-item-link">
          <span [class]="item.icon"></span>
          <span class="ml-2">{{ item.label }}</span>
          <p-badge *ngIf="item.badge" class="ml-auto" [value]="item.badge" />
          <span *ngIf="item.shortcut" class="ml-auto border border-surface rounded bg-emphasis text-muted-color text-xs p-1">{{ item.shortcut }}</span>
        </a>
      </ng-template>
    </p-menu>
  </div>
</div>
