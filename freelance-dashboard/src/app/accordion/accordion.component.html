<div class="accordion">
  <div class="accordion-header" (click)="toggleAccordion()">
    <span class="arrow" [ngClass]="{'expanded': expanded}"></span>
    <h3 class="title text-4xl font-medium">{{ title }}</h3>
    <hr class="line"/>
  </div>
  <div class="accordion-content" [ngStyle]="{'max-height': expanded ? contentHeight : '0'}">
    <div class="fd-flex fd-flex-column">
      <div class="fd-flex fd-flex-column">
        <app-status-board [positionState]="positionState"></app-status-board>
      </div>
    </div>
  </div>
</div>
