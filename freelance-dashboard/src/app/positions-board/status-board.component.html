<div class="status-board">
  <div *ngFor="let status of statusLabels"
       class="status-column"
       pDroppable="position"
       (onDrop)="onDrop(status)">

    <header class="status-header">
      <h2>{{ status | translate }}</h2>
    </header>

    <div class="cards-container">
      <app-position-card
        *ngFor="let position of getPositionsForStatus(findStatusLabelFromValue(status))"
        [position]="position"
        class="kanban-card"
        pDraggable="position"
        (onDragStart)="onDragStart(position)"
        (onDragEnd)="onDragEnd(status)">
      </app-position-card>
    </div>
  </div>
</div>


<p-confirmDialog [style]="{width: '500px'}" [baseZIndex]="10000" acceptLabel="{{'yes' | translate}}"
                 rejectLabel="{{'no' | translate}}" rejectButtonStyleClass="p-button-text"
                 acceptButtonStyleClass="p-button"></p-confirmDialog>
