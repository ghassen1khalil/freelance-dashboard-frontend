<!--<p-drawer header="{{position?.client}}" [(visible)]="isDrawerVisible" position="right" style="width: 32rem">-->
<p-drawer [(visible)]="isDrawerVisible" position="right" style="width: 32rem">
  <!--<ng-template #closeicon style="display: none"></ng-template>-->
  <ng-template #header>
    <div>
      <p class="drawer-title">{{ isCreation ? ('addPosition' | translate) : position?.client }}</p>
    </div>
  </ng-template>

  <ng-template #content>
    <form [formGroup]="positionForm" style="padding: 8px 0">
      <div class="grid">
        <div class="col-12 fd-flex fd-flex-column">
          <p-floatlabel variant="on">
            <p-datepicker formControlName="startingDate"
                          dateFormat="yy-mm-dd"
                          inputId="startingDate"
                          showIcon
                          iconDisplay="input">
            </p-datepicker>
            <label for="startingDate">{{ 'startingDate' | translate }}</label>
          </p-floatlabel>
        </div>

        <!--Client-->
        <div class="col-12 fd-flex fd-flex-column">
          <p-floatlabel variant="on">
            <input pInputText id="client" formControlName="client" autocomplete="off"/>
            <label for="client">{{ 'client' | translate }}</label>
          </p-floatlabel>
        </div>

        <!--Address-->
        <div class="col-12 fd-flex fd-flex-column">
          <p-floatlabel variant="on">
            <input pInputText id="address" formControlName="address" autocomplete="off"/>
            <label for="address">{{ 'address' | translate }}</label>
          </p-floatlabel>
        </div>

        <!--Remote-->
        <div class="col-12 fd-flex fd-flex-column">
          <p-floatlabel variant="on" class="w-full md:w-56">
            <p-select styleClass="w-full"
                      [options]="remoteDaysOptions"
                      inputId="remote"
                      formControlName="remoteDays"
                      (onChange)="onRemoteDaysSelectedOptionChange($event)">
              <ng-template #selectedItem>
                <span
                  [innerHTML]="positionDetailUtil.handleSelectedRemoteDaysOptionDisplay(remoteDaysSelectedOption, remoteDaysOptions, position)"></span>
              </ng-template>
              <ng-template let-option pTemplate="item">
                <span [innerHTML]="option.label"></span>
              </ng-template>
            </p-select>
            <label for="remote">{{ 'remote' | translate }} {{ 'daysPerWeek' | translate }}</label>
          </p-floatlabel>
        </div>

        <!--Daily Rate-->
        <div class="col-8 fd-flex fd-flex-column">
          <p-floatlabel variant="on">
            <input pInputText type="number" id="dailyRate" formControlName="dailyRate" autocomplete="off"/>
            <label for="dailyRate">{{ 'dailyRate' | translate }}</label>
          </p-floatlabel>
        </div>

        <!--Currency-->
        <div class="col-4 fd-flex fd-flex-column">
          <p-floatlabel variant="on" class="w-full md:w-56">
            <p-floatlabel variant="on" class="w-full md:w-56">
              <p-select styleClass="w-full"
                        [options]="currencies"
                        inputId="currency"
                        formControlName="currency">
                <ng-template let-currency pTemplate="item">
                  <span [innerHTML]="currency"></span>
                </ng-template>
              </p-select>
              <label for="currency">{{ 'currency' | translate }}</label>
            </p-floatlabel>
          </p-floatlabel>
        </div>

        <!--Mission-->
        <div class="col-12 fd-flex fd-flex-row ">
          <p-fieldset legend="{{'mission' | translate}}" class="fd-flex fd-flex-row fd-full-width">
            <!--Role-->
            <div class="col-12 fd-flex fd-flex-column">
              <p-floatlabel variant="on">
                <input pInputText id="role" formControlName="role" autocomplete="off"/>
                <label for="role">{{ 'role' | translate }}</label>
              </p-floatlabel>
            </div>
            <!--Project-->
            <div class="col-12 fd-flex fd-flex-column">
              <p-floatlabel variant="on">
                <input pInputText id="project" formControlName="project" autocomplete="off"/>
                <label for="project">{{ 'project' | translate }}</label>
              </p-floatlabel>
            </div>
            <!--Team-->
            <div class="col-12 fd-flex fd-flex-column">
              <p-floatlabel variant="on">
                <input pInputText id="team" formControlName="team" autocomplete="off"/>
                <label for="team">{{ 'team' | translate }}</label>
              </p-floatlabel>
            </div>
            <!--Manager-->
            <div class="col-12 fd-flex fd-flex-column">
              <p-floatlabel variant="on">
                <input pInputText id="manager" formControlName="manager" autocomplete="off"/>
                <label for="manager">{{ 'manager' | translate }}</label>
              </p-floatlabel>
            </div>
          </p-fieldset>
        </div>

        <!--Intermediary-->
        <div class="col-12 fd-flex fd-flex-row ">
          <p-fieldset legend="{{'intermediary' | translate}}" class="fd-flex fd-flex-row fd-full-width">
            <!--Corporation-->
            <div class="col-12 fd-flex fd-flex-column">
              <p-floatlabel variant="on">
                <input pInputText id="intermediaryCorporation" formControlName="intermediaryCorporation"
                       autocomplete="off"/>
                <label for="intermediaryCorporation">{{ 'corporation' | translate }}</label>
              </p-floatlabel>
            </div>

            <!--Name-->
            <div class="col-12 fd-flex fd-flex-column">
              <p-floatlabel variant="on">
                <input pInputText id="intermediaryName" formControlName="intermediaryName" autocomplete="off"/>
                <label for="intermediaryName">{{ 'name' | translate }}</label>
              </p-floatlabel>
            </div>

            <!--Phones-->
            <div class="col-12 fd-flex fd-flex-column">
              <p-floatlabel variant="on">
                <input pInputText id="intermediaryPhones" formControlName="intermediaryPhones" autocomplete="off"/>
                <label for="intermediaryPhones">{{ 'phones' | translate }}</label>
              </p-floatlabel>
            </div>

            <!--Email-->
            <div class="col-12 fd-flex fd-flex-column">
              <p-floatlabel variant="on">
                <input pInputText id="intermediaryEmail" formControlName="intermediaryEmail" autocomplete="off"/>
                <label for="intermediaryEmail">{{ 'email' | translate }}</label>
              </p-floatlabel>
            </div>
          </p-fieldset>
        </div>

        <!--Remarks-->
        <div class="col-12 fd-flex fd-flex-row">
          <p-floatlabel variant="on">
            <textarea pTextarea id="notes" formControlName="notes" rows="10" cols="30" style="resize: none"
                      class="h-full"></textarea>
            <label for="notes">{{ 'notes' | translate }}</label>
          </p-floatlabel>
        </div>


      </div>
    </form>
  </ng-template>

  <ng-template #footer>
    <div class="grid">
      @if (isButtonShown('generate')) {
      <ng-container>
        <div class="col-12">
          <p-button rounded="true"
                    label="{{'generate-followup-mail' | translate}}"
                    [style]="{'width':'100%','min-width':'100%'}"
                    [disabled]="!positionForm.valid"
                    (click)="generateFollowupMail()"
                    [icon]="'pi-sparkles'" [iconPos]="'right'">
          </p-button>
        </div>
      </ng-container>
      }

      @if (isButtonShown('save')) {
        <ng-container>
          <div class="col-12">
            <p-button rounded="true"
                      label="{{'save' | translate}}"
                      [style]="{'width':'100%','min-width':'100%'}"
                      [disabled]="!positionForm.valid"
                      (click)="savePosition()">
            </p-button>
          </div>
        </ng-container>
      }

      @if (isButtonShown('update')) {
        <ng-container>
          <div class="col-12">
            <p-button rounded="true"
                      label="{{'update' | translate}}"
                      [style]="{'width':'100%','min-width':'100%'}"
                      [disabled]="!positionForm.valid"
                      (click)="updatePosition()">
            </p-button>
          </div>
        </ng-container>
      }

      @if (isButtonShown('delete')) {
        <ng-container>
          <div class="col-12">
            <p-button rounded="true"
                      severity="danger"
                      label="{{'position-contextual-menu.remove' | translate}}"
                      [style]="{'width':'100%','min-width':'100%'}"
                      (click)="confirmDeletion()">
            </p-button>
          </div>
        </ng-container>
      }

      <ng-container>
        <div class="col-12">
          <p-button rounded="true"
                    variant="outlined"
                    label="{{'close' | translate}}"
                    [style]="{'width':'100%','min-width':'100%'}"
                    (click)="isDrawerVisible = false">
          </p-button>
        </div>
      </ng-container>
    </div>
  </ng-template>

  <p-confirmDialog [style]="{ width: '50vw' }"
                   [baseZIndex]="10000"
                   key="confirmDeletion"
                   acceptLabel="{{'yes' | translate}}"
                   rejectLabel="{{'no' | translate}}"
                   rejectButtonStyleClass="p-button-text"
                   acceptButtonStyleClass="p-button-danger">

  </p-confirmDialog>
</p-drawer>



<div class="card flex justify-center">
  <p-dialog header="{{'followupMail' | translate}}" [modal]="true" [(visible)]="isFollowupEmailEditorVisible">
    <div class="card">
      <p-editor [(ngModel)]="emailBody" [style]="{ height: '320px', width: '600px' }">
        <ng-template #header>
        <span class="ql-formats">
            <button type="button" class="ql-bold" aria-label="Bold"></button>
            <button type="button" class="ql-italic" aria-label="Italic"></button>
            <button type="button" class="ql-underline" aria-label="Underline"></button>
        </span>
        </ng-template>
      </p-editor>
    </div>
  </p-dialog>
</div>
