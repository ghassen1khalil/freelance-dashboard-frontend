<div class="fd-full-width fd-full-height fd-flex fd-flex-column align-items-center">
  <div class="grid" style="max-width: 400px">
    <div class="col-12 fd-flex fd-flex-row justify-content-center align-items-center" style="padding-bottom: 40px">
      <img class="logo" src="assets/icons/freelance_dashboard_logo.svg">
      <div class="divider">
        <p-divider layout="vertical"></p-divider>
      </div>
      <p class="text-xl font-bold app-title">{{ 'app-title' | translate }}</p>
    </div>
    <ng-container *ngIf="!isNewPasswordForm">
      <div class="col-12 fd-flex fd-flex-column" style="padding-bottom: 30px">
        <div>
          <p [innerHTML]="'resetYouPassword' | translate" class="text-3xl font-bold no-margin"></p>
        </div>
      </div>
      <ng-container *ngIf="!isRequestSent">
        <form [formGroup]="resetPasswordForm" class="fd-full-width">
          <div class="col-12 fd-flex fd-flex-row justify-content-center">
            <input class="fd-full-width" formControlName="email" id="username" pInputText
                   placeholder="{{'email' | translate}}"
                   type="text"
                   autocomplete="email ">
          </div>
        </form>
        <div class="col-12 fd-flex fd-flex-column">
          <button (click)="sendRestPasswordRequest()" [disabled]="resetPasswordForm.invalid"
                  label="{{'resetMyPassword' | translate}}" pButton
                  pRipple type="button"></button>
        </div>
        <div class="col-12 fd-flex fd-flex-column align-items-center">
          <p-button label="{{'gotBackToLogin' | translate}}" (click)="goToLogin()" class="login-button"
                    styleClass="p-button-link"></p-button>
        </div>
      </ng-container>
      <ng-container *ngIf="isRequestSent">
        <p-message severity="success" text="{{'passwordResetInstructionsSent' | translate}}"></p-message>
      </ng-container>
    </ng-container>

    <ng-container *ngIf="isNewPasswordForm">
      <ng-container *ngIf="!isTokenValid">
        <div class="col-12 fd-flex fd-flex-column" style="padding-bottom: 30px">
          <div>
            <p [innerHTML]="'resetYouPassword' | translate" class="text-3xl font-bold no-margin"></p>
          </div>
        </div>
        <p-message severity="error" text="{{'invalidPasswordResetToken' | translate}}"></p-message>
      </ng-container>
      <ng-container *ngIf="isTokenValid">
        <div class="col-12 fd-flex fd-flex-column" style="padding-bottom: 30px">
          <div>
            <p [innerHTML]="'typeYourNewPassword' | translate" class="text-3xl font-bold no-margin"></p>
          </div>
        </div>
        <form [formGroup]="newPasswordForm" class="fd-full-width" (ngSubmit)="setNewPassword()">
          <div class="grid">
            <div class="col-12 field">
                  <span class="p-float-label fd-full-width">
                     <p-password id="password"
                                 [toggleMask]="true"
                                 class="fd-full-width"
                                 formControlName="newPassword"
                                 styleClass="p-password p-component p-inputwrapper p-input-icon-right">
                        <ng-template pTemplate="header">
                           <h6>{{ 'password' | translate }}</h6>
                        </ng-template>
                        <ng-template pTemplate="footer">
                           <p-divider></p-divider>
                           <p class="mt-2">{{ 'suggestions' | translate }}</p>
                           <ul class="pl-2 ml-2 mt-0" style="line-height: 1.5">
                              <li>{{ 'atLeastOneLowercase' | translate }}</li>
                              <li>{{ 'atLeastOneUppercase' | translate }}</li>
                              <li>{{ 'atLeastOneSymbol' | translate }}</li>
                              <li>{{ 'atLeastOneDigit' | translate }}</li>
                              <li>{{ 'min8chars' | translate }}</li>
                           </ul>
                        </ng-template>
                     </p-password>
                     <label for="password">{{ 'password' | translate }}</label>
                  </span>
            </div>
            <div class="col-12 field">
                  <span class="p-float-label" fd-full-width>
                  <p-password id="confirmPassword"
                              [toggleMask]="true"
                              [feedback]="false"
                              class="fd-full-width ng-invalid ng-dirty"
                              formControlName="confirmPassword"
                              styleClass="p-password p-component p-inputwrapper p-input-icon-right"
                              [ngClass]="{'ng-invalid ng-dirty' : newPasswordForm.hasError('notSame')}">
                  </p-password>
                  <label for="confirmPassword">{{ 'confirmPassword' | translate }}</label>
                  </span>
            </div>

            <div class="col-12">
              <button class="fd-full-width" type="submit" [disabled]="!newPasswordForm.valid" pButton pRipple
                      label="{{'resetMyPassword' | translate}}"></button>
            </div>
          </div>
        </form>
      </ng-container>
    </ng-container>
  </div>
</div>
