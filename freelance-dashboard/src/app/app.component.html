<app-loader></app-loader>
<p-toast></p-toast>


<div class="dashboard-container">
  <!-- Side Navigation -->
  @if (!isLoginOrSignup) {
    <ng-container>
      <aside class="sidebar" [ngClass]="{'sidebar-collapsed': !sidebarVisible}">
        <app-navigation-menu></app-navigation-menu>
      </aside>

      <!-- Header -->
      <ng-container *ngIf="!isLoginOrSignup">
        <div class="header">
          <app-header></app-header>-
        </div>
      </ng-container>
    </ng-container>
  }

  <!-- Main Content -->
  <main class="content" [ngClass]="{'content-expanded': !sidebarVisible, 'margin-top-left': !isLoginOrSignup}">
    <router-outlet></router-outlet>
    <!--<footer class="footer">
      <app-footer></app-footer>
    </footer>-->
  </main>


  <!-- Mobile Menu Toggle -->
  <button *ngIf="isMobile" pButton icon="pi pi-bars"
          class="mobile-menu-toggle"
          (click)="sidebarVisible = !sidebarVisible"></button>
</div>
